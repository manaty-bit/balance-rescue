<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>てんびんレスキュー | MANATY LAB</title>
<style>
@font-face {
  font-family: "Latin Modern Math";
  src: url("./fonts/latinmodern-math.otf") format("opentype");
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}
:root {
  color-scheme: light;
  font: 16px/1.5 system-ui, -apple-system, "Hiragino Sans", "Yu Gothic", sans-serif;
  color: #173a30;
  background: #eff3eb;
  --ink: #173a30;
  --green: #12654f;
  --muted: #49665b;
  --paper: #fffef8;
  --line: #d2ded4;
  --focus: #985b11;
  --math: "STIX Two Math", "Cambria Math", Georgia, serif;
  --math-display: "Latin Modern Math", var(--math);
}
* { box-sizing: border-box; }
body { margin: 0; min-width: 0; }
[data-mode=drop] .mode-tabs [aria-pressed=true] { color: #fff; background: var(--green); }
body > header, main, body > footer { width: min(100% - 36px, 1080px); margin-inline: auto; }
body > header { display: flex; justify-content: space-between; align-items: center; padding: 15px 0 8px; }
.brand { display: flex; align-items: center; gap: 8px; color: var(--green); font-weight: 850; letter-spacing: .055em; font-size: .82rem; }
.brand-mark { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; font-size: 1.15rem; color: #e5f9e9; background: var(--green); }
h1, h2, p { margin: 0; }
h1 { font-size: clamp(1.72rem, 4vw, 2.9rem); letter-spacing: -.055em; line-height: 1.15; }
h2 { font-size: 1rem; line-height: 1.35; }
button, input, select { font: inherit; color: inherit; }
button, select, input { min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: #fff; padding: 7px 11px; }
button { font-weight: 730; cursor: pointer; }
button:disabled { opacity: .52; cursor: default; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
button:not(:disabled):active { transform: translateY(1px); }
.primary { color: #fff; background: var(--green); border-color: var(--green); }
.primary:not(:disabled):hover { background: #0b5140; }
.intro { display: flex; justify-content: space-between; align-items: end; gap: 10px 18px; margin: 12px 0 14px; flex-wrap: wrap; }
.intro p { color: var(--muted); margin-top: 5px; max-width: 42rem; }
.stage-nav { display: flex; flex-wrap: wrap; align-items: center; gap: 5px 12px; margin-bottom: 10px; }
.stage-buttons { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; width: min(100%, 354px); }
.stage-buttons button { padding-inline: 0; }
.stage-buttons [aria-current="step"] { color: #fff; background: var(--green); border-color: var(--green); }
#stageName { font-size: .88rem; font-weight: 700; color: var(--muted); }
.toolbar { display: flex; gap: 8px 16px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.mode-tabs, .session-tools { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
.mode-tabs { padding: 3px; border-radius: 14px; background: #dce9df; }
.mode-tabs button { border-color: transparent; background: transparent; }
.mode-tabs [aria-pressed=true] { background: #fff; color: var(--green); box-shadow: 0 1px 3px #12382b29; }
.session-tools button { font-size: .88rem; background: transparent; border-color: transparent; white-space: nowrap; }
.session-tools button:not(:disabled):hover { background: #dde9df; }
#challengeClock { font-weight: 850; font-variant-numeric: tabular-nums; color: var(--green); }
#practiceGuide { padding: 9px 12px; margin-bottom: 10px; border-left: 3px solid var(--green); background: #e3eee4; }
.play-layout { display: grid; gap: 14px; min-width: 0; }
.workbench, .guidance { display: grid; align-content: start; gap: 14px; min-width: 0; }
@media (min-width: 850px) {
  .play-layout { grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  [data-mode=quiz] .play-layout { grid-template-columns: minmax(0, 1.18fr) minmax(0, 1fr); }
  .workbench, .guidance { gap: 12px; }
  .history-panel .steps { max-height: clamp(5rem, 22vh, 15rem); }
}
@media (max-width: 849px) {
  .workbench, .guidance { display: contents; }
  .board { grid-row: 1; }
  .control-panel { grid-row: 2; }
  .shape-panel { grid-row: 3; }
  .history-panel { grid-row: 4; }
}
.board {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  min-width: 0;
  border-radius: 22px;
  border: 1px solid #c4dacf;
  padding: 12px 16px 10px;
  --rail: #3e846d;
  --landing: #12654f;
  --impact: #12654f;
  color: var(--ink);
  background: radial-gradient(ellipse at 50% 100%, #d9eee2, #f1f8ed 65%);
}
[data-mode=drop] .board {
  --rail: #78cbb2;
  --landing: #a9f0da;
  --impact: #f5d27e;
  color: #dcf4e8;
  border-color: #214e49;
  background: radial-gradient(ellipse at 50% 100%, #255951, transparent 65%), linear-gradient(145deg,#173b39,#102b30);
  box-shadow: 0 5px 0 #c4d8cb;
}
.board::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  opacity: .14;
  background-image: radial-gradient(circle, var(--rail) 1px, transparent 1.4px);
  background-size: 15px 15px;
  mask-image: linear-gradient(transparent, #000);
}
.board-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 7px; font-size: .81rem; font-weight: 750; }
#mission { white-space: nowrap; }
.mission-dots { display: flex; gap: 4px; align-items: center; }
.mission-dots span { width: 8px; height: 8px; border-radius: 50%; background: currentColor; opacity: .25; }
.mission-dots span[data-complete] { opacity: .68; }
.mission-dots span[data-current] { opacity: 1; }
.equation {
  position: relative;
  z-index: 1;
  width: fit-content;
  max-width: 100%;
  margin: 0 auto 9px;
  padding: 5px 13px;
  border-radius: 12px;
  color: #133d33;
  background: #fffdfa;
  box-shadow: 0 2px 0 #42846028;
  font: 400 clamp(1.52rem, 4.5vw, 2.65rem)/1.25 var(--math-display);
  text-align: center;
  overflow-wrap: anywhere;
}
:is(.equation, .operation-symbol, .card, .falling, .applied-equation, .history-equation, .token, .shape) math { font-family: inherit; font-size: inherit; }
.history-equation, .token math, .shape-status math { font-family: var(--math-display); }
[data-mode=drop] .equation { background: #f2fbeb; }
#equation[data-simplifying] { background: #ffefb8; color: #56380c; }
.cancel-pair { display: inline-block; position: relative; white-space: pre; }
.cancel-pair::after {
  content: "";
  position: absolute;
  inset-inline: .08em;
  top: 51%;
  height: 2px;
  background: currentColor;
  transform-origin: left;
  animation: cancel .26s 90ms both;
}
@keyframes cancel { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.pans { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(9px,4vw,30px); text-align: center; }
@media (prefers-reduced-motion: no-preference) {
  .board[data-practice-drop=true] .pans { margin-top: clamp(56px, 8vw, 96px); }
  @media (min-width: 850px) {
    .board[data-practice-drop=true] .pans { margin-top: clamp(128px, 22vh, 192px); }
  }
}
.pan-side { display: grid; grid-template-rows: auto 1fr; min-width: 0; }
.pan-label { display: block; font-size: .71rem; font-weight: 740; margin-bottom: 3px; }
.pan {
  display: flex;
  flex-wrap: wrap;
  align-content: end;
  justify-content: center;
  align-items: center;
  gap: 4px;
  min-height: 63px;
  padding: 4px;
  border-bottom: 4px solid var(--rail);
  border-radius: 12px;
}
[data-mode=drop] .pan { min-height: 78px; }
.board[data-aiming=true] .pan { background: #76cdb323; outline: 1px dashed var(--landing); outline-offset: -2px; }
.board[data-cleared=true] { border-color: #b39028; box-shadow: 0 0 0 2px #e5c97c; }
.board[data-cleared=true] .pan { border-color: #d7b34e; background: #d7b34e2b; }
.board[data-cleared=true] .equation { background: #fff2c2; }
[data-mode=drop] .board[data-cleared=true] .equation { animation: solved-equation .36s ease-out both; }
@keyframes solved-equation { 35% { transform: scale(1.05); } }
.token {
  display: grid;
  place-items: center;
  min-width: 28px;
  min-height: 29px;
  max-width: 100%;
  padding: 0 6px;
  border-radius: 8px;
  color: #523718;
  background: #ffe1a0;
  font-weight: 780;
  overflow-wrap: anywhere;
}
[data-mode=drop] .token:not(.group-token) {
  min-width: clamp(37px, 4.5vw, 52px);
  min-height: clamp(40px, 4.8vw, 55px);
  padding: 4px 7px;
  font: 400 clamp(1.12rem, 2vw, 1.6rem)/1.2 var(--math-display);
}
.token-value { min-width: 0; text-align: center; }
[data-mode=drop] .token { border-radius: 11px; box-shadow: inset 0 -3px #652b1a24; }
.token.variable { background: #1d755d; color: white; }
[data-mode=drop] .token.variable { background: #8fe4ca; color: #123c31; }
.token.negative, [data-mode=drop] .token.negative { background: #f9dbe5; color: #72254d; }
.group-token { display: inline-flex; gap: 5px; align-items: center; background: #fce2a9; border: 2px solid #b8893d; padding: 3px 7px; }
.group-payload { padding: 2px 5px; border: 1px dashed #8f6528; border-radius: 6px; background: #fff7dc; }
.scale { height: 42px; position: relative; color: var(--rail); }
.scale::before { content: ""; position: absolute; left: 25%; right: 25%; height: 3px; top: 11px; background: currentColor; border-radius: 5px; }
.scale::after { content: ""; position: absolute; left: 50%; top: 11px; transform: translateX(-50%); border: solid transparent; border-width: 0 19px 29px; border-bottom-color: currentColor; }
.hangers { width: 50%; height: 12px; margin: auto; border-inline: 2px solid currentColor; }
.panel { background: var(--paper); border: 1px solid var(--line); border-radius: 17px; padding: 13px; min-width: 0; }
.control-panel { box-shadow: 0 3px 0 #dce6dc; }
.controls { display: flex; gap: 7px; align-items: end; flex-wrap: wrap; }
.controls label { display: grid; gap: 3px; min-width: 0; font-size: .88rem; font-weight: 680; }
.controls input { width: 76px; }
.quiz-inputs { flex: 0 0 100%; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, .9fr); gap: 8px; align-items: start; }
.quiz-operations, .quiz-keypad { margin: 0; padding: 0; border: 0; min-width: 0; }
.quiz-operations { grid-row: 1 / span 2; }
.quiz-inputs #apply { grid-column: 2; }
.quiz-operations legend { padding: 0; font-size: .88rem; font-weight: 680; }
.operation-options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; margin-top: 6px; }
.operation-options label { position: relative; }
.operation-options input { position: absolute; opacity: 0; inset: 0; margin: 0; width: 100%; height: 100%; cursor: pointer; }
.operation-face { display: grid; gap: 2px; align-content: center; justify-items: center; min-height: 44px; padding: 6px; text-align: center; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
.operation-symbol { font: 400 1.3rem/1 var(--math-display); white-space: nowrap; }
.operation-options input:checked + .operation-face { border-color: var(--green); color: var(--green); background: #e2f6e9; box-shadow: inset 0 0 0 1px var(--green); }
.operation-options input:focus-visible + .operation-face { outline: 3px solid var(--focus); outline-offset: 2px; }
.operation-options input:disabled { cursor: default; }
.operation-options input:disabled + .operation-face { opacity: .62; }
.quiz-keypad { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; padding: 6px; background: #edf4ed; border-radius: 12px; }
.quiz-keypad label { grid-column: 1 / 3; grid-template-columns: auto minmax(0, 1fr); align-items: center; }
.quiz-keypad input { width: 100%; text-align: end; font-variant-numeric: tabular-nums; }
.quiz-keypad button { padding-inline: 0; font-size: 1.05rem; font-variant-numeric: tabular-nums; }
.quiz-keypad button[data-step], .quiz-keypad button[data-sign] { background: #dcebe1; }
.quiz-keypad button[data-sign] { grid-column: 3; font-weight: 800; }
.drop-action { display: grid; }
#drop { min-height: 48px; box-shadow: 0 3px 0 #083c2e; }
#drop:disabled { box-shadow: none; }
#dropPreview { grid-column: 1 / -1; color: var(--muted); font-size: .88rem; min-height: 1.5em; }
.drop-controls { display: grid; gap: 8px; margin-bottom: 10px; }
.drop-controls strong { font-size: .88rem; }
.cards { display: flex; gap: 7px; flex-wrap: wrap; margin: 6px 0 3px; }
.card, .falling {
  --card-face: #fae9bc;
  --card-edge: #a2813b;
  --card-ink: #533c18;
  background: var(--card-face);
  border-color: var(--card-edge);
  color: var(--card-ink);
}
.card { min-width: 49px; min-height: 48px; border-radius: 12px; box-shadow: 0 3px var(--card-edge); font: 400 1.22rem/1.2 var(--math-display); transition: transform 130ms ease; }
.card[aria-pressed=true] { outline: 2px solid var(--green); outline-offset: 2px; transform: translateY(-3px); }
[data-card=multiply], [data-card=divide] { --card-face: #d3e4ff; --card-edge: #7999bc; --card-ink: #173b63; }
[data-card=add], [data-card=subtract] { --card-face: #d5f2df; --card-edge: #83ad91; --card-ink: #15462f; }
.falling { pointer-events: none; position: absolute; z-index: 2; min-width: 44px; padding: 4px 7px; text-align: center; border-width: 2px; border-style: solid; border-radius: 12px; font: 400 1.22rem/1.2 var(--math-display); transform: translateX(-50%); will-change: transform; }
.impact {
  position: absolute;
  z-index: 2;
  pointer-events: none;
  width: 18px;
  height: 8px;
  border: 2px solid var(--impact);
  border-radius: 50%;
  animation: impact-ring .36s ease-out both;
}
@keyframes impact-ring { from { opacity: 1; transform: translate(-50%,-50%) scale(.35); } to { opacity: 0; transform: translate(-50%,-50%) scale(3); } }
.pan.box-open .token { animation: unpack .28s ease-out both; }
@keyframes unpack { from { opacity: .55; transform: translateY(-8px) scale(.88); } to { opacity: 1; transform: none; } }
#feedback { margin-top: 8px; min-height: 1.5em; color: var(--muted); }
#feedback.error { color: #9a3627; }
#feedback.good { color: #155c44; font-weight: 750; }
.applied-equation { margin-top: 5px; color: #26584d; font: 700 1rem/1.55 var(--math-display); overflow-wrap: anywhere; }
#moveCount { color: var(--muted); font-size: .87rem; font-variant-numeric: tabular-nums; }
#signPenalty { color: #8b3d20; font-weight: 740; margin-top: 4px; }
.score-panel { margin-top: 10px; padding: 8px 10px; color: #4d3814; background: #fff1c6; border-radius: 10px; }
#puzzleScore { font-weight: 850; font-variant-numeric: tabular-nums; }
#scoreRule { margin-top: 2px; font-size: .8rem; color: #614a20; }
.shape-panel h2, .history-panel h2 { margin-bottom: 7px; }
.shapes { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; margin-bottom: 7px; }
.shape { border: 1px solid var(--line); background: #eef4eb; border-radius: 8px; padding: 3px 7px; font: 400 1rem/1.45 var(--math-display); overflow-wrap: anywhere; min-width: 0; }
.shape[aria-current=step] { color: white; background: #21604f; border-color: #21604f; }
.shape-arrow, .shape-status { color: #315e4f; }
.shape-status { font-size: .92rem; }
.steps { margin: 0; padding-inline-start: 1.3rem; max-height: 11rem; overflow: auto; overflow-wrap: anywhere; font-size: .87rem; }
.steps li { padding: 4px 0; }
.steps li + li { border-top: 1px solid #e8ede5; }
.sign-board { background: #fff6da; border: 1px solid #ddc58c; border-radius: 13px; padding: 10px; margin-bottom: 10px; }
.sign-line, .sign-options { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; margin-top: 5px; }
.sign-options > span { min-width: 6em; }
.sign-sign { min-width: 44px; }
.sign-options button[aria-pressed=true] { background: var(--green); color: white; }
.sign-math { font: 700 1.16rem/1.5 var(--math); }
#checkSigns { margin-top: 7px; }
.award-dialog { color: var(--ink); background: var(--paper); border: 1px solid #adc7ba; border-radius: 18px; width: min(32rem, calc(100% - 24px)); max-height: 90dvh; padding: 18px; }
.award-dialog::backdrop { background: #102c3080; }
.award-dialog ul { padding-inline-start: 1.3rem; }
.award-dialog footer { display: flex; flex-wrap: wrap; gap: 7px; }
.award-dialog label { display: grid; gap: 5px; margin-top: 12px; }
.award-dialog input { width: 100%; }
.award-dialog p { margin: 8px 0; }
body > footer { padding: 14px 0; color: var(--muted); font-size: .83rem; }
body > footer a { color: var(--green); }
[hidden] { display: none !important; }
@media (max-width: 570px) {
  body > header, main, body > footer { width: min(100% - 24px, 1080px); }
  body > header { padding-top: 8px; }
  .intro { margin: 6px 0 10px; }
  .intro p { font-size: .88rem; }
  .stage-nav { display: grid; grid-template-columns: auto 1fr; align-items: baseline; gap: 3px 8px; }
  .stage-buttons { grid-column: 1 / -1; grid-row: 2; }
  #stageName { grid-column: 2; grid-row: 1; }
  [data-mode=quiz] .intro p { display: none; }
  .stage-nav { margin-bottom: 6px; }
  .board { position: sticky; top: 0; z-index: 3; }
  .control-panel :is(button, input) { scroll-margin-top: 21rem; }
  [data-mode=quiz] .control-panel :is(button, input) { scroll-margin-top: 17rem; }
  .toolbar { gap: 4px 8px; margin-bottom: 5px; }
  .mode-tabs button, .session-tools button { font-size: .8rem; padding-inline: 8px; }
  .board { padding: 9px 9px 6px; }
  .pan, [data-mode=drop] .pan { min-height: 61px; }
  .workbench, .guidance, .play-layout { gap: 10px; }
  .drop-controls { gap: 6px; }
  .cards { gap: 5px; }
  .card { flex: 1 0 auto; min-width: 44px; max-width: 100%; min-height: 44px; padding-inline: 5px; overflow-wrap: anywhere; }
  [data-mode=quiz] .board .pan { min-height: 44px; }
  [data-mode=quiz] .board .scale { height: 33px; }
  [data-mode=quiz] .board .scale::after { border-bottom-width: 22px; }
  .operation-options { grid-template-columns: 1fr; gap: 4px; }
  .operation-face { padding: 3px; font-size: .8rem; line-height: 1.15; }
}
@media (prefers-reduced-motion: reduce) {
  .card { transition: none; }
  .pan.box-open .token, .impact, .cancel-pair::after, [data-mode=drop] .board[data-cleared=true] .equation { animation: none; }
}
/* Compact desktop layout: keep the equation history in the right column. */
@media (min-width: 850px) and (max-height: 900px) {
  body > header { padding-block: 7px 4px; }
  .intro { margin-block: 5px 8px; }
  h1 { font-size: clamp(1.65rem, 3vw, 2.15rem); }
  .stage-nav { margin-bottom: 5px; }
  .toolbar { margin-bottom: 7px; }
  .play-layout, .workbench, .guidance { gap: 9px; }
  .panel { padding: 10px; }
  .board[data-practice-drop=true] .pans { margin-top: clamp(72px, 13vh, 118px); }
  .board[data-cleared=true] .pans { margin-top: 20px; }
  .history-panel .steps { max-height: clamp(5rem, 18vh, 10rem); }
}

/* Compact top layout for desktop */
@media (min-width: 980px) {
  body > header, main, body > footer { width: min(100% - 40px, 1540px); }
  body > header { padding: 8px 0 4px; }
  .brand { font-size: .78rem; }
  .brand-mark { width: 28px; height: 28px; font-size: 1rem; }
  .intro { align-items: end; gap: 4px 16px; margin: 2px 0 8px; }
  .intro p { margin-top: 2px; font-size: .92rem; max-width: 52rem; }
  h1 { font-size: clamp(1.7rem, 2.8vw, 2.65rem); line-height: 1.08; }
  .toolbar { gap: 6px 14px; margin-bottom: 8px; }
  .mode-tabs { padding: 2px; border-radius: 12px; }
  .mode-tabs button, .session-tools button { min-height: 40px; padding-block: 6px; }
  .stage-label, .stage-nav { gap: 6px 10px; margin-bottom: 4px; }
  .stage-buttons { gap: 3px; }
  .play-layout, .workbench, .guidance { gap: 12px; }
}


/* Stage selection: use the free space at the top right on desktop. */
.stage-buttons button { position: relative; }
.stage-buttons button:hover:not(:disabled) { border-color: var(--green); background: #e1eee4; }
.stage-buttons [aria-current="step"]:hover:not(:disabled) { background: var(--green); color: #fff; }
@media (min-width: 980px) {
  .top-navigation { display: grid; grid-template-columns: minmax(0, 1fr) minmax(350px, .85fr); grid-template-areas: "intro stages" "toolbar stages"; column-gap: 20px; row-gap: 4px; align-items: center; margin-bottom: 10px; }
  .top-navigation .intro { grid-area: intro; margin: 0; }
  .top-navigation .toolbar { grid-area: toolbar; margin: 0; }
  .top-navigation .stage-nav { grid-area: stages; display: grid; grid-template-columns: 1fr; gap: 6px; justify-self: end; align-self: center; width: min(100%, 440px); padding: 10px 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--paper); margin: 0; }
  .top-navigation #stageLabel { font-size: .82rem; font-weight: 800; color: var(--green); }
  .top-navigation .stage-buttons { width: 100%; gap: 5px; }
  .top-navigation .stage-buttons button { min-height: 40px; padding: 4px 0; font-size: 1rem; }
  .top-navigation #stageName { font-size: .96rem; color: var(--ink); font-weight: 750; min-height: 1.45em; }
}


/* Comfortable desktop proportions when vertical space is available. */
@media (min-width: 980px) and (min-height: 760px) {
  .play-layout { align-items: stretch; gap: 16px; }

<script>
(() => {
  'use strict';
  const groups = [
    {side:'left', multiplier:2, inside:3, outerX:0, outerNumber:0, other:[0,14]},
    {side:'left', multiplier:2, inside:-3, outerX:0, outerNumber:7, other:[0,15]},
    {side:'left', multiplier:-2, inside:-1, outerX:5, outerNumber:0, other:[0,14]},
    {side:'right', multiplier:2, inside:2, outerX:0, outerNumber:0, other:[3,0]},
    {side:'right', multiplier:-2, inside:-3, outerX:4, outerNumber:0, other:[4,0]},
    {side:'left', multiplier:2, inside:1, outerX:0, outerNumber:0, other:[0,7]},
    {side:'left', multiplier:3, inside:-2, outerX:0, outerNumber:0, other:[0,2]},
    {side:'left', multiplier:-2, inside:1, outerX:0, outerNumber:0, other:[0,7]}
  ];
  const grouped = groups.map(({side,multiplier,inside,outerX,outerNumber,other},i)=>{
    const expanded=[outerX+multiplier,outerNumber+multiplier*inside];
    const sides=side==='left'?[...expanded,...other]:[...other,...expanded];
    return [...sides,1,i];
  });
  const groupFor = state => groups[state[5]];
  function expand(state,signs) {
    const group=groupFor(state);
    if(!group)return {error:'invalid'};
    const {multiplier,inside}=group;
    if(signs[0]!==Math.sign(multiplier))return {error:'signX'};
    if(signs[1]!==Math.sign(multiplier*inside))return {error:'signNumber'};
    return {state:state.slice(0,4)};
  }
  const levels = [
    [[1,3,0,7],[1,5,0,7],[1,2,0,8],[1,5,0,2]],
    [[4,0,0,12],[2,0,0,5],[3,2,0,14],[3,1,0,8],[2,5,0,13],[-3,0,0,12],[-2,0,0,-5]],
    [[3,2,1,10],[4,1,2,8],[4,1,2,9],[5,2,2,7],[5,0,2,12],[1,2,4,9]],
    [[4,3,0,15,10],[4,1,0,8,10],[1,2,0,8,10],[3,2,1,7,10],[3,2,1,10,10],[-4,1,0,8,10]],
    [[1,2,0,8,4],[2,1,0,6,6],[2,3,0,11,6],[4,1,1,6,6],[3,2,1,10,6],[-2,1,0,6,6]],
    grouped
  ];
  // Four signed integer numerators and an optional common denominator.
  const limit = 1_000_000_000n;
  const abs = n => n < 0n ? -n : n;
  function gcd(a,b) {
    a=abs(a);
    b=abs(b);
    while(b)[a,b]=[b,a%b];
    return a;
  }
  function apply(state,operation,amount) {
    if(groupFor(state))return {error:'openFirst'};
    if(!Number.isSafeInteger(amount)||Math.abs(amount)>Number(limit))return {error:'invalid'};
    if(amount===0)return {error:operation==='multiply'||operation==='divide'?'zeroOperation':'unchanged'};
    let [a,b,c,d,scale=1n]=state.map(BigInt);
    const n=BigInt(amount), delta=n*scale;
    switch(operation){
      case 'add': b+=delta; d+=delta; break;
      case 'subtract': b-=delta; d-=delta; break;
      case 'addVariable': a+=delta; c+=delta; break;
      case 'remove': a-=delta; c-=delta; break;
      case 'multiply': a*=n; b*=n; c*=n; d*=n; break;
      case 'divide': scale*=n; break;
      default: return {error:'invalid'};
    }
    if(scale<0n){a=-a;b=-b;c=-c;d=-d;scale=-scale;}
    const common=[a,b,c,d].reduce(gcd,scale);
    const normalized=[a,b,c,d,scale].map(value=>value/common);
    if(normalized.some(value=>abs(value)>limit))return {error:'limit'};
    const result=(normalized[4]===1n?normalized.slice(0,4):normalized).map(Number);
    if(result.length===state.length&&result.every((value,index)=>value===state[index]))return {error:'unchanged'};
    return {state:result};
  }
  function nextMove([a,b,c,,scale=1]) {
    if(scale>1)return ['multiply',scale];
    if(c)return [c>0?'remove':'addVariable',Math.abs(c)];
    if(b)return [b>0?'subtract':'add',Math.abs(b)];
    return ['divide',a];
  }
  function cards(state,turn) {
    const [a,b,c]=state;
    const negative=a<0||b<0||c<0||state[3]<0;
    const choices=[nextMove(state),['add',1],['remove',1],['multiply',negative?-1:3],['divide',negative?-2:2]];
    const unique=choices.filter(([op,n],i)=>choices.findIndex(([other,m])=>op===other&&n===m)===i);
    const offset=(turn+1)%unique.length;
    return [...unique.slice(offset),...unique.slice(0,offset)];
  }
  function form([a,b,c,,scale=1,group]) {
    if(group!==undefined)return -2;
    if(a===scale&&!b&&!c)return 3;
    if(scale>1)return -1;
    if(c)return 0;
    if(b)return 1;
    return 2;
  }
  function isDetour(before,after){
    const previousForm=form(before),nextForm=form(after);
    if(previousForm!==nextForm)return nextForm<previousForm;
    if(nextForm===3)return false;
    const priorScale=before[4]??1,scale=after[4]??1;
    if(nextForm<0&&scale!==priorScale)return scale>priorScale;
    return after.slice(0,3).some((value,i)=>Math.abs(value)*priorScale>Math.abs(before[i])*scale);
  }
  function puzzleScore(elapsed,moves){
    const seconds=Math.floor(elapsed/1000);
    return {seconds,moves,points:Math.max(0,1000-seconds*10-moves*60)};
  }
  function stageResult(answers,total){
    const correct=answers.filter(Boolean).length;
    return {correct,total,accuracy:Math.round(correct*100/total),grade:correct===total?'gold':'silver'};
  }
  function retainStage(previous,award){
    if(!previous||award.total!==previous.total||award.correct>previous.correct)return award;
    return previous;
  }
  window.BalanceRescue = { levels, apply, cards, nextMove, form, groupFor, expand, stageResult, retainStage, isDetour, puzzleScore };
})();
</script>

    questionClock={elapsed:0,since:null};
    feedback='ready';
    played=0;
    signPenalty=0;
    detoured=false;
    signs=null;
    shapeGained=false;
    selectedCard=null;
    $('amount').value=1;
    replaceAmount=true;
    render();
  }
  function translate() {
    document.documentElement.lang=language;
    document.querySelectorAll('[data-label]').forEach(el=>el.textContent=copy()[el.dataset.label]);
    document.querySelector('.board').setAttribute('aria-label',copy().balance);
    $('language').textContent=language==='ja'?'EN':'日本語';
    $('language').lang=language==='ja'?'en':'ja';
    $('quizKeypad').querySelector('[data-sign]').setAttribute('aria-label',copy().toggleSign);
    $('quizKeypad').querySelector('[data-step="1"]').setAttribute('aria-label',copy().increase);
    $('quizKeypad').querySelector('[data-step="-1"]').setAttribute('aria-label',copy().decrease);
    document.body.dataset.mode=mode;
    for(const action of document.querySelectorAll('.quiz-action'))action.hidden=mode==='drop';
    $('quizMode').setAttribute('aria-pressed',String(mode==='quiz'));
    $('dropMode').setAttribute('aria-pressed',String(mode==='drop'));
    document.querySelector('[data-label="intro"]').textContent=copy()[mode==='drop'?'dropIntro':'intro'];
    for(const button of $('stage').querySelectorAll('button')){
      const index=Number(button.dataset.stage);
      const stageTitle=index===-1?copy().practice:copy().stages[index];
      button.setAttribute('aria-label',stageTitle);
      button.title=stageTitle;
    }
    render();
  }
  function perform(operation,amount){
    const before=current();
    const result=apply(before,operation,amount);
    function complete(){
      intermediate=null;
      dropping=false;
      detoured=Boolean(result.state&&isDetour(before,result.state));
      feedback=result.error||'step';
      shapeGained=Boolean(result.state&&form(result.state)>form(before));
      if(result.state){
        played++;
        history.push({state:result.state,operation,amount});
      }
      if(mode==='drop'&&!challengeRun?.active&&solved(current())){
        best.set(key(),Math.min(played,best.get(key())??Infinity));
      }
      render();
      if(solved(current())){
        if(challengeRun?.active)advanceChallenge();
        else $('next').focus();
      }else if(mode==='drop'){
        $('cards').firstElementChild?.focus({preventScroll:true});
      }
    }
    if(result.state&&mode==='drop'&&!challengeRun?.active&&!matchMedia('(prefers-reduced-motion: reduce)').matches){
      dropping=true;
      const [a,b,,,scale=1]=before;
      const cancels=a&&b&&((operation==='add'&&b===-amount*scale)||(operation==='subtract'&&b===amount*scale));
      intermediate={text:sameOperation(before,operation,amount,true),cancelFrom:cancels?xTerm(a,scale).length:0};
      render();
      setTimeout(complete,420);
      return;
    }
    complete();
  }
  $('amount').addEventListener('input',()=>{replaceAmount=false;});
  $('quizKeypad').addEventListener('click',event=>{
    const button=event.target.closest('button');
    if(!button)return;
    const amount=$('amount');
    const currentAmount=amount.valueAsNumber||0;
    const max=Number(amount.max);
    if(button.dataset.sign){
      amount.value=currentAmount===0?-1:-currentAmount;
      replaceAmount=true;
      return;
    }
    if(button.dataset.step){
      amount.value=Math.max(-max,Math.min(max,currentAmount+Number(button.dataset.step)));
      replaceAmount=true;
      return;
    }
    const sign=currentAmount<0?-1:1;
    const value=sign*((replaceAmount?0:Math.abs(currentAmount))*10+Number(button.dataset.digit));
    if(Math.abs(value)<=max)amount.value=value;
    replaceAmount=false;
  });
  $('controls').addEventListener('submit',event=>{
    event.preventDefault();
    if(mode==='quiz'&&!groupFor(current())&&!solved(current())){
      perform($('controls').elements.operation.value,$('amount').valueAsNumber);
      replaceAmount=true;
    }
  });
  function settle(targets,speed){
    const seconds=.32;
    const amplitude=Math.min(12,speed*.022);
    const frames=Array.from({length:20},(_,i)=>{
      const time=i*seconds/19;
      const offset=i===19?0:amplitude*Math.exp(-12*time)*Math.sin(29*time);
      return {transform:`translateY(${offset}px)`};
    });
    for(const pan of targets){
      for(const animation of pan.getAnimations())animation.cancel();
      const board=pan.closest('.board');
      const bounds=board.getBoundingClientRect(), rect=pan.getBoundingClientRect();
      const ring=document.createElement('span');
      ring.className='impact';
      ring.setAttribute('aria-hidden','true');
      ring.style.left=(rect.left+rect.width/2-bounds.left)+'px';
      ring.style.top=(rect.bottom-bounds.top-4)+'px';
      board.append(ring);
      setTimeout(()=>ring.remove(),360);
      pan.animate(frames,{duration:seconds*1000,easing:'linear'});
    }
  }
  function fall(label,operation,targets,onImpact){
    if(matchMedia('(prefers-reduced-motion: reduce)').matches){
      onImpact();
      return;
    }
    const board=document.querySelector('.board');
    if(!challengeRun?.active)board.scrollIntoView({block:'nearest',behavior:'instant'});
    const bounds=board.getBoundingClientRect();
    const startY=$('equation').getBoundingClientRect().bottom-bounds.top+3;
    const falling=targets.map(pan=>{
      for(const animation of pan.getAnimations())animation.cancel();
      const rect=pan.getBoundingClientRect();
      const chip=document.createElement('span');
      chip.className='falling';
      chip.dataset.card=operation;
      chip.append(equationContent(label));
      chip.setAttribute('aria-hidden','true');
      chip.style.left=(rect.left+rect.width/2-bounds.left)+'px';
      chip.style.top=startY+'px';
      board.append(chip);
      const distance=Math.max(1,rect.bottom-bounds.top-chip.offsetHeight-startY-5);
      return {chip,distance};
    });
    const furthest=Math.max(...falling.map(({distance})=>distance));
    // A fixed duration keeps short drops on narrow screens easy to follow.
    const duration=challengeRun?.active?450:1450;
    // Show the operation on both cards before they start moving in practice.
    const launch=performance.now()+(challengeRun?.active?0:220);
    function frame(now){
      const progress=Math.max(0,(now-launch)/duration);
      if(progress>=1){
        falling.forEach(({chip})=>chip.remove());
        onImpact();
        settle(targets,2*furthest/(duration/1000));
        return;
      }
      const travel=progress*progress;
      for(const {chip,distance} of falling){
        chip.style.transform=`translate(-50%, ${travel*distance}px)`;
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }
  $('openGroup').onclick=()=>{
    const group=groupFor(current());
    if(dropping||signs||!group)return;
    function askSigns(){
      dropping=false;
      signs=[0,0];
      render();
      $('signChoices').querySelector('button').focus({preventScroll:true});
    }
    if(mode==='quiz'){askSigns();return;}
    dropping=true;
    render();
    fall(copy().open,'open',[$(group.side)],askSigns);
  };
  $('checkSigns').onclick=()=>{
    if(!signs||signs.some(value=>value===0))return;
    const result=expand(current(),signs);
    if(!result.state){
      feedback=result.error;
      signPenalty++;
      hadError=true;
      played++;
      render();
      $('signChoices').children[feedback==='signX'?0:1].querySelector('[aria-pressed=true]').focus({preventScroll:true});
      return;
    }
    const group=groupFor(current());
    const expanded=distributed(group);
    signs=null;
    played++;
    history.push({state:result.state,operation:'open',expanded});
    shapeGained=true;
    feedback='step';
    render();
    const openedPan=$(group.side);
    openedPan.classList.remove('box-open');
    if(mode==='drop'&&!matchMedia('(prefers-reduced-motion: reduce)').matches){
      void openedPan.offsetWidth;
      openedPan.classList.add('box-open');
      openedPan.addEventListener('animationend',()=>openedPan.classList.remove('box-open'),{once:true});
    }
    focusOperation({preventScroll:true});
  };
  $('drop').onclick=()=>{
    if(!selectedCard||dropping||solved(current()))return;
    const [operation,amount]=selectedCard;
    dropping=true;
    render();
    fall(cardLabel(operation,amount),operation,[$('left'),$('right')],()=>{
      selectedCard=null;
      dropping=false;
      perform(operation,amount);
    });
  };
  $('undo').onclick=()=>{
    if(history.length>1)history.pop();
    signs=null;
    selectedCard=null;
    shapeGained=false;
    feedback='ready';
    render();
  };
  function focusOperation(options){
    const target=groupFor(current())?$('openGroup'):mode==='drop'?$('cards').firstElementChild:$('operation').querySelector(':checked');
    target?.focus(options);
  }
  function switchMode(next){
    if(mode===next||challengeRun?.active)return;
    mode=next;
    selectedCard=null;
    translate();
  }
  $('quizMode').onclick=()=>switchMode('quiz');
  $('dropMode').onclick=()=>switchMode('drop');
  $('hint').onclick=()=>{shapeGained=false;feedback='hint';render();};
  function selectStage(next){
    stage=next;
    problem=0;
    stageAnswers=[];
    if(next>=0){
      progress.stages[next]??={attempts:0,best:null};
      progress.stages[next].attempts++;
      saveProgress();
    }
    start();
  }
  $('stage').onclick=event=>{
    const button=event.target.closest('button[data-stage]');
    if(button&&Number(button.dataset.stage)!==stage)selectStage(Number(button.dataset.stage));
  };
  $('next').onclick=()=>{
    if(challengeRun?.active||!solved(current()))return;
    if(stage===-1){selectStage(0);return;}
    stageAnswers.push(!hadError);
    if(problem+1===activeLevel().length){
      const record=progress.stages[stage];
      const stamp=new Date().toISOString();
      const result={...stageResult(stageAnswers,activeLevel().length),stage,attempt:record.attempts,stamp};
      record.best=retainStage(record.best,result);
      saveProgress();
      selectStage((stage+1)%levels.length);
      showRecords(result);
      return;
    }
    problem++;
    start();
    focusOperation();
  };
  $('language').onclick=()=>{language=language==='ja'?'en':'ja';translate();};
  function updateClock(){
    if(!challengeRun?.active)return;
    const remaining=Math.max(0,Math.ceil((challengeRun.deadline-performance.now())/1000));
    $('challengeClock').hidden=false;
    $('challengeClock').textContent=copy().clock(remaining,challengeRun.score);
  }
  function advanceChallenge(){
    if(!challengeRun?.active)return;
    if(performance.now()>=challengeRun.deadline){finishChallenge();return;}
    challengeRun.score++;
    problem=(problem+1)%challengeLevels.length;
    start();
    focusOperation({preventScroll:true});
  }
  function finishChallenge(){
    if(!challengeRun?.active)return;
    const {score,practiceState}=challengeRun;
    challengeRun=null;
    clearInterval(challengeTimer);
    $('challengeClock').hidden=true;
    progress.challengeBest=Math.max(progress.challengeBest,score);
    saveProgress();
    ({problem,history,feedback,hadError,played,signPenalty,detoured,shapeGained,signs,selectedCard,questionClock}=practiceState);
    render();
    showRecords({challenge:score,stamp:new Date().toISOString()});
  }
  $('challenge').onclick=()=>{
    if(challengeRun?.active)finishChallenge();
    else{
      $('challengeDialog').showModal();
      syncQuestionClock();
    }
  };
  $('closeChallenge').onclick=()=>$('challengeDialog').close();
  $('challengeDialog').addEventListener('close',syncQuestionClock);
  $('startChallenge').onclick=()=>{
    $('challengeDialog').close();
    const practiceState={problem,history,feedback,hadError,played,signPenalty,detoured,shapeGained,signs,selectedCard,questionClock};
    challengeRun={active:true,practiceState,deadline:performance.now()+60000,score:0};
    problem=0;
    start();
    challengeTimer=setInterval(()=>{
      // A card already in the air lands before the timeout is handled.
      if(performance.now()>=challengeRun.deadline&&!dropping)finishChallenge();
      else updateClock();
    },80);
  };

  function awardTitle(item){
    const w=copy();
    if(item.graduation)return w.graduation;
    if(Object.hasOwn(item,'challenge'))return w.challenge;
    return w[item.grade];
  }
  function awardLines(item){
    const w=copy();
    if(item.graduation)return progress.stages.map(record=>w.stages[record.best.stage]+' · '+w[record.best.grade]);
    if(Object.hasOwn(item,'challenge'))return [w.challengeResult(item.challenge),w.bestScore(progress.challengeBest)];
    const lines=[w.stages[item.stage],w.completion(item.total),w.attempts(item.attempt)];
    if(levels[item.stage].some(groupFor))lines.splice(2,0,w.score(item.correct,item.total,item.accuracy));
    return lines;
  }
  function showRecords(item=null){
    const w=copy();
    award=item;
    $('awardError').textContent='';
    $('nickname').value='';
    $('nameLabel').hidden=!item;
    $('saveAward').hidden=!item;
    const earned=progress.stages.filter(record=>record?.best).length;
    $('graduation').hidden=earned!==levels.length||Boolean(item?.graduation);
    $('clearRecords').hidden=!progress.stages.some(Boolean)&&!progress.challengeBest;
    $('recordTitle').textContent=item?awardTitle(item):w.records;
    $('recordSummary').textContent=item?'':earned||progress.challengeBest?w.stageProgress(earned,levels.length)+' · '+w.bestScore(progress.challengeBest):w.noRecords;
    const entries=item?awardLines(item).map(text=>({text})):progress.stages.filter(record=>record?.best).map(({best,attempts})=>({
      text:w.stages[best.stage]+' · '+w.attempts(attempts),result:best
    }));
    $('recordList').replaceChildren(...entries.map(({text,result})=>{
      const li=document.createElement('li');
      li.textContent=text;
      if(result){
        const button=document.createElement('button');
        button.type='button';
        button.textContent=w[result.grade];
        button.onclick=()=>showRecords(result);
        li.append(' ',button);
      }
      return li;
    }));
    if(!$('recordDialog').open)$('recordDialog').showModal();
    syncQuestionClock();
  }
  $('records').onclick=()=>showRecords();
  $('closeRecords').onclick=()=>$('recordDialog').close();
  $('recordDialog').addEventListener('close',()=>{$('nickname').value='';award=null;syncQuestionClock();});
  $('graduation').onclick=()=>showRecords({graduation:true,stamp:new Date().toISOString()});
  $('clearRecords').onclick=()=>{
    if(!confirm(copy().confirmClear))return;
    progress={stages:[],challengeBest:0};
    best.clear();
    saveProgress();
    selectStage(-1);
    showRecords();
  };
  $('saveAward').onclick=()=>{
    if(!award)return;
    const w=copy(), item=award;
    const name=$('nickname').value.trim()||w.anonymous;
    const canvas=document.createElement('canvas');
    canvas.width=1200;
    canvas.height=840;
    const ctx=canvas.getContext('2d');
    if(!ctx){$('awardError').textContent=w.saveError;return;}
    const gold=item.grade==='gold';
    ctx.fillStyle=gold?'#fff5da':'#edf7f1';
    ctx.fillRect(0,0,1200,840);
    ctx.strokeStyle=gold?'#936312':'#2e6e62';
    ctx.lineWidth=5;
    ctx.strokeRect(32,32,1136,776);
    ctx.textAlign='center';
    ctx.fillStyle='#163630';
    function line(text,y,size,bold=false){
      ctx.font=`${bold?'700':'400'} ${size}px system-ui,sans-serif`;
      ctx.fillText(text,600,y,1040);
    }
    line('MANATY LAB',108,24,true);
    line(awardTitle(item),193,68,true);
    line(w.title+' ｜ '+w.unit,255,28);
    line(name,364,54,true);
    awardLines(item).forEach((text,i)=>line(text,440+i*46,30));
    const date=new Date(item.stamp);
    const dateLabel=new Intl.DateTimeFormat(language,{
      year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit',
      fractionalSecondDigits:3,timeZoneName:'short'
    }).format(date);
    line(dateLabel,770,24);
    canvas.toBlob(blob=>{
      if(!blob){$('awardError').textContent=w.saveError;return;}
      const link=document.createElement('a');
      link.href=URL.createObjectURL(blob);
      link.download='balance-rescue-'+item.stamp.replace(/[^0-9]/g,'')+'.png';
      link.click();
      setTimeout(()=>URL.revokeObjectURL(link.href),2000);
    },'image/png');
  };
  selectStage(stage);
  translate();
  document.addEventListener('visibilitychange',syncQuestionClock);
})();
</script>
</body>
</html>
